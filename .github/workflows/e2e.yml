# e2e（Playwright mock 全量）：为什么不挂 push / pull_request ——
# 一轮要装浏览器 + next dev 起服务，约 5 分钟起步，每个 PR 都跑会拖慢门禁；
# 已拍板 D-2=a：先每日定时 + 手动触发，稳定后再评估是否进 PR 门禁。
# 定时为 UTC 20:00（北京 04:00），与备份 cron（北京 03:17）错开。
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright (mock)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 与本地/AGENTS.md 隔离约定一致：mock 上游必须就位，数据目录独立。
      E2E_REQUIRE_MOCK: "1"
      E2E_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config 的 webServer 用 next dev，不需要 next build；
      # 但 dev 启动要 typegen 产物，与 CI 门禁同一步。
      - name: Typegen
        run: pnpm exec next typegen

      - name: e2e
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
