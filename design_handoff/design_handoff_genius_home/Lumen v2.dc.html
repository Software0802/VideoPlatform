<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap">
  <style>
    html,body{margin:0;height:100%;background:#0a0d12;color:#fff;font-family:Manrope,"Noto Sans SC",-apple-system,"PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-synthesis:none}
    body{overflow:hidden}
    a{color:#fff;text-decoration:none}a:hover{color:#DDE1E8}
    button,textarea{font:inherit;color:inherit;background:none;border:0}
    textarea::placeholder{color:#8B8C8E}
    :focus{outline:none}:focus-visible{outline:2px solid #C9CED8;outline-offset:3px;border-radius:4px}
    canvas{display:block}
    @keyframes e-down{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
    @keyframes e-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes e-focus{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
    @keyframes e-panel{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes e-pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    @keyframes e-send{from{transform:scale(.82)}to{transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
  </style>
</helmet>
<div data-screen-label="Genius" style="position:relative;height:100vh;overflow:hidden;background:#0a0d12;color:#fff">
  <canvas ref="{{ refDawn }}" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <sc-if value="{{ isWorks }}" hint-placeholder-val="{{ false }}">
    <canvas ref="{{ refRing }}" onPointerDown="{{ dragStart }}" onPointerMove="{{ dragMove }}" onPointerUp="{{ dragEnd }}" onPointerLeave="{{ dragEnd }}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;animation:e-pop .8s cubic-bezier(.22,1,.36,1) both"></canvas>
  </sc-if>

  <div style="position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding:{{ framePad }};pointer-events:none;transition:padding .8s cubic-bezier(.22,1,.36,1)">
    <header style="position:relative;display:flex;align-items:center;justify-content:space-between;height:43px;pointer-events:none">
      <button type="button" onClick="{{ goHome }}" style="display:flex;align-items:center;gap:12px;cursor:pointer;pointer-events:auto;font-size:18px;font-weight:500;letter-spacing:-.015em;text-shadow:0 1px 10px rgba(0,0,0,.3);animation:e-down .58s cubic-bezier(.22,1,.36,1) .06s both">
        <span style="width:30px;height:30px;border-radius:50%;background:conic-gradient(from 210deg,#f2f4f7,#7f8794 35%,#c9ced8 60%,#5d6472 80%,#f2f4f7);box-shadow:inset 0 0 0 8px #0e1117,inset 0 0 0 9px rgba(255,255,255,.18),0 2px 10px rgba(0,0,0,.4);animation:e-send .62s cubic-bezier(.16,1,.3,1) .06s both"></span>Genius
      </button>
      <nav style="position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:40px;font-size:15px;font-weight:500;letter-spacing:-.01em;text-shadow:0 1px 12px rgba(0,0,0,.32);pointer-events:auto">
        <button type="button" onClick="{{ goHome }}" style="cursor:pointer;opacity:{{ navHome }};transition:opacity .18s ease;animation:e-down .5s cubic-bezier(.22,1,.36,1) .16s both" style-hover="opacity:.72">首页</button>
        <button type="button" onClick="{{ goWorks }}" style="cursor:pointer;opacity:{{ navWorks }};transition:opacity .18s ease;animation:e-down .5s cubic-bezier(.22,1,.36,1) .21s both" style-hover="opacity:.72">作品</button>
        <button type="button" style="cursor:pointer;opacity:.6;transition:opacity .18s ease;animation:e-down .5s cubic-bezier(.22,1,.36,1) .26s both" style-hover="opacity:.72">我的</button>
      </nav>
      <button type="button" style="pointer-events:auto;cursor:pointer;height:40px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:600;letter-spacing:-.012em;background:linear-gradient(180deg,#3d3d3f 0%,#1d1d20 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 14px rgba(0,0,0,.28);transition:filter .18s ease;animation:e-down .55s cubic-bezier(.22,1,.36,1) .34s both" style-hover="filter:brightness(1.16)" style-active="transform:translateY(1px)">登录</button>
    </header>

    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;flex:1;min-height:0">

        <div style="position:absolute;left:50%;top:calc(50% - 128px);transform:translate(-50%,-50%) {{ heroShift }};opacity:{{ heroOp }};pointer-events:none;transition:opacity .45s ease,transform .6s cubic-bezier(.22,1,.36,1)">
          <h1 style="margin:0;font-size:clamp(26px,2.5vw,38px);font-weight:400;line-height:1.1;letter-spacing:.002em;text-shadow:0 2px 22px rgba(0,0,0,.3);text-align:center;white-space:nowrap;animation:e-focus 1s cubic-bezier(.16,1,.3,1) .3s both">创建你的世界</h1>
        </div>

        <aside style="position:absolute;left:0;top:0;bottom:0;width:340px;opacity:{{ studioOp }};transform:{{ consoleT }};pointer-events:{{ studioPE }};transition:opacity .5s ease .4s,transform .8s cubic-bezier(.22,1,.36,1) .4s">
          <div style="height:100%;border-radius:22px;background:rgba(28,30,36,.9);box-shadow:inset 0 0 0 1px rgba(214,228,255,.12);padding:22px 20px;display:flex;flex-direction:column;gap:26px;overflow:auto">
            <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
              <div style="display:flex;flex-direction:column;gap:10px">
                <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#98999C;letter-spacing:.04em"><span>{{ g.title }}</span><span style="color:#DDE1E8;font-size:11px">{{ g.current }}</span></div>
                <div style="display:flex;flex-wrap:wrap;gap:6px">
                  <sc-for list="{{ g.options }}" as="o" hint-placeholder-count="3">
                    <button type="button" onClick="{{ o.pick }}" style="height:30px;padding:0 13px;border-radius:9px;font-size:12px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;flex-shrink:0;color:{{ o.color }};background:{{ o.bg }};border:1px solid rgba(255,255,255,.05);transition:background .18s ease,color .18s ease" style-hover="color:#c8c8cb">{{ o.label }}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </aside>

        <div style="position:absolute;left:364px;right:0;top:0;bottom:{{ exhibBottom }};display:flex;align-items:center;justify-content:center;opacity:{{ studioOp }};transform:{{ exhibT }};pointer-events:{{ studioPE }};transition:opacity .6s ease .5s,transform .9s cubic-bezier(.22,1,.36,1) .5s,bottom .3s ease">
          <div style="position:relative;width:min(100%,calc((100vh - 360px) * 16 / 9));aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#0c0e13 {{ exhibBg }} center / cover no-repeat;box-shadow:inset 0 0 0 1px rgba(214,228,255,.12),0 30px 80px rgba(0,0,0,.45)">
            <sc-if value="{{ exhibIdle }}" hint-placeholder-val="{{ true }}">
              <span style="position:absolute;left:20px;bottom:16px;font-size:12px;color:#98999C;letter-spacing:.04em">预览</span>
            </sc-if>
            <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
                <span style="font-size:clamp(40px,5vw,72px);font-weight:300;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums">{{ jobPct }}</span>
                <span style="font-size:12px;color:#98999C;letter-spacing:.04em;font-variant-numeric:tabular-nums">{{ jobStage }} · {{ jobClock }}</span>
              </div>
              <div style="position:absolute;left:0;bottom:0;height:2px;background:#DDE1E8;width:{{ barW }};transition:width .4s ease"></div>
            </sc-if>
            <sc-if value="{{ hasResult }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 18px;display:flex;align-items:center;gap:16px;font-size:12px;color:#DDE1E8;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55))">
                <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8">{{ resultMeta }}</span>
                <button type="button" style="cursor:pointer;color:#fff;opacity:.85" style-hover="opacity:1">下载</button>
                <button type="button" onClick="{{ closeResult }}" style="cursor:pointer;color:#fff;opacity:.6" style-hover="opacity:1">关闭</button>
              </div>
            </sc-if>
          </div>
        </div>

        <div style="position:absolute;left:{{ compLeft }};top:{{ compTop }};transform:{{ compT }};width:{{ compW }};pointer-events:auto;transition:left .8s cubic-bezier(.22,1,.36,1),top .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1),width .8s cubic-bezier(.22,1,.36,1)">
        <form onSubmit="{{ onSubmit }}" style="position:relative;width:100%;min-height:143px;border-radius:26px;background:rgba(28,30,36,.92);box-shadow:inset 0 0 0 1px rgba(214,228,255,.12);padding:24px 22px 12px 22px;display:flex;flex-direction:column;gap:{{ compGap }};animation:e-panel .9s cubic-bezier(.16,1,.3,1) .62s both;transition:gap .5s ease">
          <textarea ref="{{ refText }}" rows="{{ rows }}" value="{{ prompt }}" onChange="{{ setPrompt }}" onKeyDown="{{ onKey }}" placeholder="{{ placeholder }}" style="width:100%;resize:none;padding:0 0 0 5px;font-size:15px;line-height:1.5;letter-spacing:.007em;color:#fff;animation:e-pop .5s cubic-bezier(.22,1,.36,1) .88s both"></textarea>
          <div style="display:flex;align-items:center;gap:14px">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;animation:e-pop .5s cubic-bezier(.22,1,.36,1) .94s both">
              <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
                <button type="button" onClick="{{ m.pick }}" style="height:30px;padding:0 13px;border-radius:9px;font-size:12px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;flex-shrink:0;color:{{ m.color }};background:{{ m.bg }};border:1px solid rgba(255,255,255,.05);transition:background .18s ease,color .18s ease" style-hover="color:#c8c8cb">{{ m.label }}</button>
              </sc-for>
              <sc-if value="{{ isVideo }}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{ cycleDur }}" style="height:30px;padding:0 10px 0 13px;border-radius:9px;font-size:12px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;color:#909093;background:linear-gradient(180deg,rgba(255,255,255,.088) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.038) 100%);border:1px solid rgba(255,255,255,.05)" style-hover="color:#c8c8cb">{{ durLabel }}<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
              </sc-if>
              <button type="button" onClick="{{ cycleRatio }}" style="height:30px;padding:0 10px 0 13px;border-radius:9px;font-size:12px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;color:#909093;background:linear-gradient(180deg,rgba(255,255,255,.088) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.038) 100%);border:1px solid rgba(255,255,255,.05)" style-hover="color:#c8c8cb">{{ ratio }}<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
            </div>
            <div style="margin-left:auto;display:flex;align-items:center;gap:18px;height:30px;animation:e-pop .5s cubic-bezier(.22,1,.36,1) 1s both">
              <span style="font-size:12px;color:#98999C;line-height:1;white-space:nowrap">{{ modelName }}</span>
              <button type="button" onClick="{{ toggleFirst }}" title="首帧" style="cursor:pointer;color:{{ clipColor }};display:grid;place-items:center;height:30px;transition:color .18s ease" style-hover="color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
              <button type="submit" aria-label="生成" style="width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:{{ sendBg }};box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 10px rgba(0,0,0,.35);transition:filter .18s ease;animation:e-send .5s cubic-bezier(.16,1,.3,1) 1s both" style-hover="filter:brightness(1.06)" style-active="transform:scale(.95)">
                <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#15171c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></sc-if>
                <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:50%;background:#1d1d20;display:grid;place-items:center;font-size:8px;font-weight:600;color:#DDE1E8;font-variant-numeric:tabular-nums">{{ jobPct }}</span></sc-if>
              </button>
            </div>
          </div>
        </form>
        </div>

        <div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:14px;opacity:{{ heroOp }};transform:{{ thumbsT }};pointer-events:{{ heroPE }};transition:opacity .45s ease,transform .6s cubic-bezier(.22,1,.36,1)">
          <sc-for list="{{ recent }}" as="r" hint-placeholder-count="6">
            <button type="button" onClick="{{ r.pick }}" style="width:clamp(120px,10.5vw,168px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;cursor:pointer;opacity:.78;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.35);transition:opacity .2s ease,transform .25s cubic-bezier(.22,1,.36,1);background:url({{ r.src }}) center / cover;animation:e-up .55s cubic-bezier(.22,1,.36,1) {{ r.delay }} both" style-hover="opacity:1;transform:translateY(-3px)"></button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isWorks }}" hint-placeholder-val="{{ false }}">
      <main style="flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0;padding-top:24px">
        <div style="display:flex;justify-content:center;pointer-events:auto;animation:e-down .5s cubic-bezier(.22,1,.36,1) .1s both">
          <div style="display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(28,30,36,.9);box-shadow:inset 0 0 0 1px rgba(214,228,255,.12)">
            <button type="button" onClick="{{ pickVideo }}" style="height:30px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;color:{{ videoFg }};background:{{ videoBg }};transition:background .18s ease,color .18s ease" style-hover="color:#fff">视频<span style="font-size:11px;opacity:.6;font-variant-numeric:tabular-nums">{{ videoCount }}</span></button>
            <button type="button" onClick="{{ pickImage }}" style="height:30px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;color:{{ imageFg }};background:{{ imageBg }};transition:background .18s ease,color .18s ease" style-hover="color:#fff">图片<span style="font-size:11px;opacity:.6;font-variant-numeric:tabular-nums">{{ imageCount }}</span></button>
          </div>
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;gap:8px;max-width:560px;animation:e-up .6s cubic-bezier(.22,1,.36,1) .2s both">
            <span style="font-size:12px;color:#98999C;letter-spacing:.02em">{{ selMeta }}</span>
            <p style="margin:0;font-size:clamp(20px,1.8vw,28px);font-weight:500;line-height:1.3;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.4)">{{ selPrompt }}</p>
          </div>
          <div style="display:flex;align-items:center;gap:10px;pointer-events:auto;animation:e-up .6s cubic-bezier(.22,1,.36,1) .3s both">
            <span style="font-size:12px;color:#98999C;margin-right:10px;font-variant-numeric:tabular-nums">{{ angle }} · 拖拽旋转</span>
            <button type="button" onClick="{{ reuse }}" style="height:40px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:filter .18s ease" style-hover="filter:brightness(1.15)">用这条提示词再生成</button>
            <button type="button" style="height:40px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;color:#15171c;background:linear-gradient(180deg,#f7f7f5 0%,#cfd2d8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 10px rgba(0,0,0,.35);transition:filter .18s ease" style-hover="filter:brightness(1.07)">下载</button>
          </div>
        </div>
      </main>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;horizon&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.46,&quot;min&quot;:0.3,&quot;max&quot;:0.7,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;背景&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;作品环&quot;}}">
const IMGS = ['2e9cde0e2fb0803e','a72d8b509c55bcd0','a1f3319d0d783e66','f3bfe52263d0656d','d99c0972e1f99b67','a9008119d34b8fc1','5a09f4952b5ad9b6','6f297b60448c30c9'].map(n => 'assets/lumina/' + n + '.webp');
const PROMPTS = ['玉米田深处，一个穿银色防护服的人走来', '像素风峡谷日出，河流蜿蜒穿过山谷', '雨夜的外滩，一位穿深青色风衣的女人走向江边', '清晨的山谷薄雾，镜头缓慢推进', '霓虹街道，慢速推轨', '海岸线航拍，日落前', '旧仓库里的一束光', '雪后的胡同口'];
// 每件作品的类型：视频 / 图片
const KIND = ['video', 'video', 'image', 'video', 'image', 'video', 'image', 'video'];
const MODES = [{ id: 't2v', label: '文生视频' }, { id: 'i2v', label: '图生视频' }, { id: 't2i', label: '文生图' }];
const RATIOS = ['16:9', '9:16', '1:1'], DURS = [4, 6, 8, 10];
const SEND = 'linear-gradient(180deg,#f7f7f5 0%,#cfd2d8 100%)';
const CHIP = 'linear-gradient(180deg,rgba(255,255,255,.088) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.038) 100%)';
// 操作台：每组单选；选中后该选项的提示词飞入输入框，多段之间空一行
const GROUPS = [
  { id: 'filter', title: '滤镜', options: [
    { id: 'film', label: '胶片', text: '胶片颗粒质感，轻微暗角，柔和高光' },
    { id: 'bw', label: '黑白', text: '黑白影像，高对比，银盐质感' },
    { id: 'teal', label: '青橙', text: '青橙色调，阴影偏青、肤色偏暖' },
    { id: 'soft', label: '柔光', text: '柔光滤镜，轻微光晕，低对比' } ] },
  { id: 'skin', title: '磨皮', options: [
    { id: 'light', label: '轻度', text: '人物皮肤轻度磨皮，保留毛孔与纹理' },
    { id: 'mid', label: '中度', text: '人物皮肤中度磨皮，肤色均匀自然' },
    { id: 'strong', label: '强', text: '人物皮肤强磨皮，柔焦人像效果' } ] },
  { id: 'color', title: '色彩', options: [
    { id: 'warm', label: '暖调', text: '整体暖色调，金色阳光氛围' },
    { id: 'cool', label: '冷调', text: '整体冷色调，蓝灰清晨氛围' },
    { id: 'sat', label: '高饱和', text: '高饱和色彩，鲜明浓烈' },
    { id: 'desat', label: '低饱和', text: '低饱和色彩，克制素净' } ] },
  { id: 'cam', title: '镜头', options: [
    { id: 'push', label: '缓慢推进', text: '镜头缓慢推进，稳定平滑' },
    { id: 'orbit', label: '环绕', text: '镜头环绕主体，弧形运动' },
    { id: 'hand', label: '手持', text: '手持镜头，轻微自然晃动' } ] },
];
const optOf = (g, o) => GROUPS.find(x => x.id === g).options.find(x => x.id === o);
const stripSeg = (p, text) => p.split('\n\n').filter(seg => seg.trim() !== text).join('\n\n');
class Component extends DCLogic {
  state = { view: 'home', studio: false, opts: {}, prompt: '', mode: 't2v', dur: 8, ratio: '16:9', first: false, job: null, now: 0, result: null, sel: 0, hov: -1, drag: 0, kind: 'video' };
  refText = (el) => { this.textEl = el; };
  // 选项芯片飞向输入框，然后落成提示词
  fly(e, text, done) {
    const from = e.currentTarget.getBoundingClientRect(), to = this.textEl?.getBoundingClientRect();
    if (!to) return done();
    const el = document.createElement('span');
    el.textContent = text;
    el.style.cssText = 'position:fixed;z-index:99;left:' + from.left + 'px;top:' + from.top + 'px;height:30px;padding:0 13px;border-radius:9px;display:inline-flex;align-items:center;font:500 12px Manrope,"Noto Sans SC",sans-serif;color:#fff;background:rgba(255,255,255,.17);box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap';
    document.body.appendChild(el);
    const dx = to.left + 8 - from.left, dy = to.bottom - 30 - from.top;
    const anim = el.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx * 0.55 + 'px,' + (dy * 0.35 - 40) + 'px) scale(1.04)', opacity: 1, offset: .45 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.7)', opacity: 0 },
    ], { duration: 640, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
    let finished = false;
    const finish = () => { if (finished) return; finished = true; el.remove(); done(); };
    anim.onfinish = finish; anim.oncancel = finish; setTimeout(finish, 720);
  }
  pickOpt(g, o, e) {
    const s = this.state, prev = s.opts[g.id];
    const opts = { ...s.opts };
    let p = s.prompt;
    if (prev) p = stripSeg(p, optOf(g.id, prev).text);
    if (prev === o.id) { delete opts[g.id]; this.setState({ opts, prompt: p }); return; }
    opts[g.id] = o.id;
    this.fly(e, o.label, () => this.setState({ opts, prompt: p.trim() ? p.replace(/\s+$/, '') + '\n\n' + o.text : o.text }));
  }
  list(kind) { return IMGS.map((src, i) => ({ src, i })).filter(x => KIND[x.i] === (kind || this.state.kind)); }
  refDawn = (el) => { this.dawnEl = el; };
  refRing = (el) => { if (el) { this.ringEl = el; this.mountRing(); } else if (this.ringEl) { this.ring?.dispose(); this.ring = null; this.ringEl = null; } };
  componentDidMount() {
    import('./lumen-fx.js').then((m) => { this.fx = m; if (this.dawnEl) this.dawn = m.mountDawn(this.dawnEl, { horizon: this.props.horizon ?? 0.46 }); this.mountRing(); }).catch(() => {});
    this.clock = setInterval(() => this.state.job && this.setState({ now: Date.now() }), 500);
    let last = performance.now();
    const drift = () => { const n = performance.now(); if (this.props.autoRotate ?? true) { this.idle = (this.idle || 0) + (n - last) / 1000 * 0.003; this.ring?.setScroll(this.state.drag + this.idle); } last = n; this.raf = requestAnimationFrame(drift); };
    this.raf = requestAnimationFrame(drift);
  }
  componentWillUnmount() { clearInterval(this.clock); clearInterval(this.sim); cancelAnimationFrame(this.raf); this.dawn?.dispose(); this.ring?.dispose(); }
  mountRing() {
    if (!this.fx || !this.ringEl || this.ring) return;
    const items = this.list();
    const radius = Math.max(2.6, items.length * 0.58);
    this.ring = this.fx.mountRingDark(this.ringEl, { images: items.map(x => x.src), radius, onSelect: (k) => this.setState({ sel: items[k].i }), onHover: (k) => { const i = k < 0 ? -1 : items[k].i; if (i !== this.state.hov) this.setState({ hov: i }); } });
    this.ring.setScroll(this.state.drag + (this.idle || 0));
  }
  submit = () => {
    if (this.state.job) return;
    if (this.state.mode !== 'i2v' && !this.state.prompt.trim()) return;
    clearInterval(this.sim);
    const job = { p: 0, started: Date.now() };
    this.setState({ job, now: Date.now(), result: null, studio: true });
    this.dawn?.setEnergy(1);
    this.sim = setInterval(() => {
      const j = { ...this.state.job }; j.p = Math.min(100, j.p + 1.5 + Math.random() * 4);
      if (j.p >= 100) { clearInterval(this.sim); this.dawn?.setEnergy(0); this.setState({ job: null, result: { src: IMGS[2], meta: MODES.find(m => m.id === this.state.mode).label + ' · ' + (this.state.mode === 't2i' ? '1K' : this.state.dur + 's · 720p') + ' · ' + this.state.ratio + ' · ' + (this.state.prompt || '首帧起始') } }); return; }
      this.setState({ job: j });
    }, 300);
  };
  renderVals() {
    const s = this.state, j = s.job, isVideo = s.mode !== 't2i', busy = !!j;
    const sel = s.hov >= 0 ? s.hov : s.sel;
    const isImg = KIND[sel] === 'image';
    const dur = 6 + (sel % 3) * 2, kind = isImg ? '文生图' : sel % 3 === 0 ? '图生视频' : '文生视频';
    const setKind = (k) => { if (k === s.kind) return; const first = this.list(k)[0]; this.ring?.dispose(); this.ring = null; this.setState({ kind: k, sel: first ? first.i : 0, hov: -1 }, () => this.mountRing()); };
    const sec = j ? Math.floor((s.now - j.started) / 1000) : 0;
    const stage = j ? (j.p < 10 ? '排队中' : j.p < 30 ? '已提交' : j.p < 90 ? '生成中' : '写入中') : '';
    const pct = j ? Math.round(j.p) : 0;
    const st = s.studio;
    const rows = st ? Math.min(7, Math.max(3, s.prompt.split('\n').length)) : 2;
    const ang = String(Math.round(((((s.drag + (this.idle || 0)) % 1) + 1) % 1) * 360)).padStart(3, '0') + '°';
    return {
      refDawn: this.refDawn, refRing: this.refRing, refText: this.refText,
      isHome: s.view === 'home', isWorks: s.view === 'works', navHome: s.view === 'home' ? 1 : .6, navWorks: s.view === 'works' ? 1 : .6,
      goHome: () => this.setState({ view: 'home', studio: false }), goWorks: () => this.setState({ view: 'works' }),
      // 工作室布局：输入栏落到底部，左操作台 / 右展览区
      framePad: st ? '4vh clamp(24px,4vw,72px) 4.5vh 32px' : '4vh clamp(24px,6vw,120px) 4.5vh',
      studioOp: st ? 1 : 0, studioPE: st ? 'auto' : 'none', heroOp: st ? 0 : 1, heroPE: st ? 'none' : 'auto',
      heroShift: st ? 'translateY(-24px)' : 'translateY(0)', thumbsT: st ? 'translateY(28px)' : 'translateY(0)',
      consoleT: st ? 'translateX(0)' : 'translateX(-40px)', exhibT: st ? 'translateY(0) scale(1)' : 'translateY(24px) scale(.98)',
      compLeft: st ? 'calc(50% + 182px)' : '50%', compTop: st ? '100%' : '50%', compT: st ? 'translate(-50%,-100%)' : 'translate(-50%,-50%)',
      compW: st ? 'min(708px, calc(100% - 364px))' : 'min(708px, 100%)', compGap: st ? '22px' : '46px', rows, exhibBottom: (236 + (rows - 3) * 23) + 'px',
      exhibBg: s.result ? 'url(' + s.result.src + ')' : 'linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,0) 60%)', exhibIdle: !busy && !s.result,
      groups: GROUPS.map(g => ({ title: g.title, current: s.opts[g.id] ? optOf(g.id, s.opts[g.id]).label : '', options: g.options.map(o => { const on = s.opts[g.id] === o.id; return { label: o.label, color: on ? '#fff' : '#909093', bg: on ? 'rgba(255,255,255,.17)' : CHIP, pick: (e) => this.pickOpt(g, o, e) }; }) })),
      dragStart: (e) => { this.dragX = e.clientX; }, dragEnd: () => { this.dragX = null; },
      dragMove: (e) => { if (this.dragX == null) return; const d = (e.clientX - this.dragX) / innerWidth; this.dragX = e.clientX; this.setState({ drag: s.drag - d * 0.6 }); },
      prompt: s.prompt, setPrompt: (e) => { const v = e.target.value; const opts = {}; for (const k in s.opts) if (v.includes(optOf(k, s.opts[k]).text)) opts[k] = s.opts[k]; this.setState({ prompt: v, opts, studio: s.studio || !!v.trim() }); },
      onKey: (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); this.submit(); } },
      onSubmit: (e) => { e.preventDefault(); this.submit(); },
      placeholder: s.mode === 'i2v' ? '已选首帧，提示词可选' : s.mode === 't2i' ? '清晨山谷薄雾，一束光落在湖面' : '清晨山谷薄雾，镜头缓慢推进…',
      modes: MODES.map(m => { const on = m.id === s.mode; return { label: m.label, on, color: on ? '#fff' : '#909093', bg: on ? 'rgba(255,255,255,.17)' : CHIP, pick: () => this.setState({ mode: m.id }) }; }),
      isVideo, durLabel: s.dur + 's', ratio: s.ratio,
      cycleDur: () => this.setState({ dur: DURS[(DURS.indexOf(s.dur) + 1) % DURS.length] }),
      cycleRatio: () => this.setState({ ratio: RATIOS[(RATIOS.indexOf(s.ratio) + 1) % RATIOS.length] }),
      modelName: isVideo ? 'grok-imagine-video' : 'grok-imagine-image',
      toggleFirst: () => this.setState({ first: !s.first, mode: !s.first && s.mode === 't2v' ? 'i2v' : s.mode }), clipColor: s.first ? '#fff' : '#A9AAAD',
      idle: !busy, busy, sendBg: busy ? 'conic-gradient(#DDE1E8 ' + pct + '%, rgba(255,255,255,.14) 0)' : SEND,
      jobPct: pct + '%', jobStage: stage, jobClock: String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'),
      hasResult: !!s.result, resultMeta: s.result ? s.result.meta : '', closeResult: () => this.setState({ result: null }),
      recent: IMGS.slice(0, 6).map((src, i) => ({ src, delay: (1.08 + i * 0.06).toFixed(2) + 's', pick: () => { this.ring?.dispose(); this.ring = null; this.setState({ view: 'works', sel: i, kind: KIND[i], hov: -1 }, () => this.mountRing()); } })),
      selPrompt: PROMPTS[sel], selMeta: isImg ? kind + ' · 1K · 16:9' : kind + ' · ' + dur + 's · 16:9 · 720p', angle: ang,
      kindVideo: s.kind === 'video', kindImage: s.kind === 'image',
      videoBg: s.kind === 'video' ? 'rgba(255,255,255,.17)' : 'transparent', videoFg: s.kind === 'video' ? '#fff' : '#909093',
      imageBg: s.kind === 'image' ? 'rgba(255,255,255,.17)' : 'transparent', imageFg: s.kind === 'image' ? '#fff' : '#909093',
      videoCount: this.list('video').length, imageCount: this.list('image').length,
      pickVideo: () => setKind('video'), pickImage: () => setKind('image'),
      reuse: () => this.setState({ prompt: PROMPTS[sel], opts: {}, mode: isImg ? 't2i' : sel % 3 === 0 ? 'i2v' : 't2v', view: 'home', studio: true }),
    };
  }
}
</script>
